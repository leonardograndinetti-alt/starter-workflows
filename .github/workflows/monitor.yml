name: Monitoramento Semanal Leilões RF

on:
  schedule:
    # Executa todo sábado às 09:00 UTC (06:00 no Horário de Brasília)
    - cron: '0 9 * * 6'
  workflow_dispatch: # Permite disparar o teste manualmente na aba Actions do GitHub

jobs:
  run-agent:
    # Fixa o runner no Ubuntu 24.04 para garantir estabilidade de ambiente
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Agente de Leilão
        env:
          EMAIL_ORIGEM: ${{ secrets.EMAIL_ORIGEM }}
          SENHA_APP: ${{ secrets.SENHA_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python agente.py
